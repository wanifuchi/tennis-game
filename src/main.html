<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テニスゲーム</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; }
    .container { max-width: 400px; margin: 40px auto; background: #fff; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
    h1 { text-align: center; }
    .score { font-size: 1.5em; text-align: center; margin: 1em 0; }
    .buttons { display: flex; justify-content: space-between; margin: 1em 0; }
    button { flex: 1; margin: 0 0.5em; padding: 1em; font-size: 1em; border-radius: 4px; border: none; background: #1976d2; color: #fff; cursor: pointer; }
    button:disabled { background: #aaa; }
    .status { text-align: center; margin-top: 1em; color: #1976d2; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>テニスゲーム</h1>
    <div class="score" id="score">Player 1: 0 - Player 2: 0</div>
    <div class="buttons">
      <button id="p1">Player 1 得点</button>
      <button id="p2">Player 2 得点</button>
    </div>
    <button id="start">ゲーム開始</button>
    <button id="end">ゲーム終了</button>
    <div class="status" id="status">Not Started</div>
  </div>
  <script src="../dist/main.js"></script>
</body>
</html>
